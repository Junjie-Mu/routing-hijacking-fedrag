[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "routing-hijacking-fedrag"
version = "0.1.0"
description = "Core code for Routing Hijacking and Trust-Aware Secure Routing in Federated RAG."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "datasets>=2.14",
  "sentence-transformers>=2.2",
  "torch>=2.1",
  "tqdm>=4.66",
  "pandas>=2.0",
]

[project.optional-dependencies]
generation = [
  "transformers>=4.40",
  "accelerate>=0.30",
  "safetensors>=0.4",
]
he = [
  "tenseal>=0.3.16",
]
bge = [
  "FlagEmbedding>=1.3.0",
]
faiss = [
  "faiss-cpu>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fedrag*", "scripts*"]
